<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.25" />
    </pattern>

    <style>
      .pulse-orb {
        animation: pulseGlow 6s ease-in-out infinite alternate;
      }
      .dash-flow {
        stroke-dasharray: 8 8;
        animation: dashStream 25s linear infinite;
      }
      .float-badge {
        animation: subtleFloat 5s ease-in-out infinite alternate;
      }
      .float-badge-delayed {
        animation: subtleFloat 5s ease-in-out 2.5s infinite alternate;
      }
      @keyframes pulseGlow {
        0% { opacity: 0.35; transform: scale(0.98); }
        100% { opacity: 0.7; transform: scale(1.05); }
      }
      @keyframes dashStream {
        to { stroke-dashoffset: -300; }
      }
      @keyframes subtleFloat {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)" />

  <!-- Animated Ambient Glows (Kept strictly behind foreground content) -->
  <circle cx="240" cy="120" r="260" fill="url(#glow-cyan)" class="pulse-orb" />
  <circle cx="980" cy="300" r="280" fill="url(#glow-purple)" class="pulse-orb" />

  <!-- Subtle Cyber Grid -->
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Background Flow Lines (Dynamic streaming circuit lines behind text) -->
  <g opacity="0.35">
    <path d="M 50 80 Q 300 20 600 80 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="2" class="dash-flow" />
    <path d="M 50 360 Q 400 320 700 370 T 1150 340" fill="none" stroke="#a855f7" stroke-width="2" class="dash-flow" />
    <path d="M 100 220 C 350 280, 850 140, 1100 220" fill="none" stroke="#6366f1" stroke-width="1.5" class="dash-flow" />
  </g>

  <!-- Decorative Background Pill Badges (Right side dynamic composition) -->
  <g class="float-badge" opacity="0.85">
    <rect x="880" y="70" width="250" height="42" rx="21" fill="#1e293b" stroke="url(#card-border)" stroke-width="1.5" />
    <circle cx="905" cy="91" r="7" fill="#10b981" />
    <text x="925" y="96" fill="#e2e8f0" font-size="13" class="mono-text" font-weight="600">🚀 Internal Dev Portals</text>
  </g>

  <g class="float-badge-delayed" opacity="0.85">
    <rect x="850" y="130" width="280" height="42" rx="21" fill="#1e293b" stroke="url(#card-border)" stroke-width="1.5" />
    <circle cx="875" cy="151" r="7" fill="#38bdf8" />
    <text x="895" y="156" fill="#e2e8f0" font-size="13" class="mono-text" font-weight="600">⚡ Self-Hosted Git Forges</text>
  </g>

  <g class="float-badge" opacity="0.85">
    <rect x="890" y="190" width="240" height="42" rx="21" fill="#1e293b" stroke="url(#card-border)" stroke-width="1.5" />
    <circle cx="915" cy="211" r="7" fill="#f59e0b" />
    <text x="935" y="216" fill="#e2e8f0" font-size="13" class="mono-text" font-weight="600">📦 OCI Registries</text>
  </g>

  <g class="float-badge-delayed" opacity="0.85">
    <rect x="840" y="250" width="290" height="42" rx="21" fill="#1e293b" stroke="url(#card-border)" stroke-width="1.5" />
    <circle cx="865" cy="271" r="7" fill="#ec4899" />
    <text x="885" y="276" fill="#e2e8f0" font-size="13" class="mono-text" font-weight="600">🤖 AI Model Registries &amp; APIs</text>
  </g>

  <!-- FOREGROUND CONTENT: High contrast, uncluttered, prominent hierarchy -->
  <!-- Top Category Tag -->
  <g transform="translate(80, 85)">
    <rect width="210" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
    <text x="105" y="21" fill="#c7d2fe" font-size="12" class="mono-text" font-weight="700" text-anchor="middle">AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="170" fill="url(#primary-grad)" font-size="46" class="title-text">
    Developer Ecosystem Platform
  </text>

  <!-- Subtitle Line 1 -->
  <text x="80" y="222" fill="#f1f5f9" font-size="20" class="subtitle-text">
    Curated Hub of Internal Developer Portals, Git Forges &amp; AI Infra
  </text>

  <!-- Subtitle Line 2 (Descriptor) -->
  <text x="80" y="254" fill="#94a3b8" font-size="15" class="subtitle-text">
    Comprehensive benchmark of SaaS leaders &amp; battle-tested open-source alternatives
  </text>

  <!-- Metrics / Capability Highlights in Footer Bar -->
  <g transform="translate(80, 310)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="190" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="16" y="23" fill="#38bdf8" font-size="13" class="mono-text" font-weight="600">✓ 24+ Open Source</text>

    <!-- Pill 2 -->
    <rect x="205" y="0" width="180" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="221" y="23" fill="#a855f7" font-size="13" class="mono-text" font-weight="600">✓ 10 SaaS Leaders</text>

    <!-- Pill 3 -->
    <rect x="400" y="0" width="220" height="36" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="416" y="23" fill="#34d399" font-size="13" class="mono-text" font-weight="600">✓ Pricing &amp; Quota Matrix</text>
  </g>

  <!-- Outer Border Frame -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
