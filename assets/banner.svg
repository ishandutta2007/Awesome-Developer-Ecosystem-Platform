<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/></linearGradient><linearGradient id="primary-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="card-border" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".6"/><stop offset="100%" stop-color="#818cf8" stop-opacity=".1"/></linearGradient><radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%"><stop offset="0%" stop-color="#0ea5e9" stop-opacity=".28"/><stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/></radialGradient><radialGradient id="glow-purple" cx="80%" cy="70%" r="55%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".25"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".25" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(.98)}}@keyframes subtleFloat{0%{transform:translateY(0)}}.pulse-orb{animation:pulseGlow 6s ease-in-out infinite alternate}.dash-flow{stroke-dasharray:8 8;animation:dashStream 25s linear infinite}.float-badge{animation:subtleFloat 5s ease-in-out infinite alternate}.float-badge-delayed{animation:subtleFloat 5s ease-in-out 2.5s infinite alternate}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.5px}.subtitle-text{font-weight:400}.mono-text{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}</style></defs><rect width="